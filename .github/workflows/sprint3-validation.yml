name: Validación funcional hasta Sprint 3
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=critical
      - run: npm run test:coverage
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ecologistica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ecologistica_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - run: pip install -r src/backend/requirements.txt
      - run: pip install bandit pip-audit
      - run: bandit -r src/backend/app -lll
      - run: pip-audit -r src/backend/requirements.txt
      - name: Verify original schema and additive migration on PostGIS
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -d ecologistica_test -v ON_ERROR_STOP=1 -f src/database/init.sql
          psql -h localhost -U postgres -d ecologistica_test -v ON_ERROR_STOP=1 -f scripts/006_sprint3_route_updates.sql
          psql -h localhost -U postgres -d ecologistica_test -v ON_ERROR_STOP=1 -f scripts/006_sprint3_route_updates.sql
      - name: Unit and integration tests
        working-directory: src/backend
        env:
          CODECARBON_ENABLED: '0'
          POSTGRES_TEST_URL: postgresql+psycopg://postgres:test-only@localhost:5432/ecologistica_test
        run: pytest --cov-fail-under=80
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: src/mobile
      - run: flutter analyze --no-fatal-infos
        working-directory: src/mobile
      - run: flutter test --coverage
        working-directory: src/mobile
      - run: dart run tool/check_coverage.dart
        working-directory: src/mobile
      - run: flutter build web --release
        working-directory: src/mobile
      - run: flutter build apk --debug
        working-directory: src/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: ecologistica-sprint3-debug
          path: src/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
  staging:
    name: Despliegue y aceptación en entorno desechable
    runs-on: ubuntu-latest
    needs: [frontend, backend, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure isolated test credentials
        run: |
          python - <<'PY'
          import os,secrets
          from pathlib import Path
          admin=secrets.token_urlsafe(30)
          print('::add-mask::'+admin)
          Path('.env').write_text('POSTGRES_PASSWORD='+secrets.token_urlsafe(30)+'\nSECRET_KEY='+secrets.token_urlsafe(40)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('STAGING_ADMIN_PASSWORD='+admin+'\n')
          PY
      - run: docker compose up -d --build
      - name: Wait for disposable database
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T db psql -U postgres -d ecologistica_db -v ON_ERROR_STOP=1 -c 'SELECT licencia_vencimiento FROM conductores LIMIT 0'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Bootstrap isolated test administrator
        run: |
          docker compose exec -T -e STAGING_ADMIN_PASSWORD backend python - <<'PY'
          import os
          from app.db.session import SessionLocal
          from app.models.conductor import Conductor
          from app.models.usuario import Usuario
          from app.core.auth import hash_password
          with SessionLocal() as db:
              db.add(Usuario(email='staging-admin@example.test',nombre_completo='Staging test administrator',rol='ADMIN',permisos=[],estado='ACTIVO',password_hash=hash_password(os.environ['STAGING_ADMIN_PASSWORD'])))
              db.commit()
          PY
      - run: pip install httpx
      - name: Verify deployed app and real API flow
        run: |
          python scripts/sprint3_staging_smoke.py
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5173/ -o /dev/null
      - name: Tear down disposable environment
        if: always()
        run: docker compose down -v
