name: Sprint 4 CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: src/frontend
      - run: npm run build
        working-directory: src/frontend
      - run: npm audit --audit-level=critical
        working-directory: src/frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r src/backend/requirements.txt bandit pip-audit
      - run: python -m compileall -q src/backend
      - name: Verify closure reports, EVM arithmetic and relative links
        run: python scripts/verify_closure.py
      - name: Verify availability coverage and failure accounting
        run: python -m unittest discover -s scripts/tests -p test_availability_summary.py
      - run: bandit -r src/backend/app -lll
      - run: pip-audit -r src/backend/requirements.txt
      - run: git diff --check
