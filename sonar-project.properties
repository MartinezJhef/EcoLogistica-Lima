# ==============================================================================
# SonarQube Configuration File - EcoLogística Lima
# Sistema Integral de Gestión y Optimización de Rutas Verdes (CVRPTW)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Identificación del Proyecto en SonarQube / SonarCloud
# ------------------------------------------------------------------------------
sonar.projectKey=ecologistica-lima
sonar.projectName=EcoLogistica Lima - Optimizador de Rutas Verdes
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------------------
# 2. Rutas de Código Fuente y Pruebas (Monorepo: Backend, Frontend, Mobile)
# ------------------------------------------------------------------------------
sonar.sources=src/backend/app,src/frontend/src,src/mobile/lib
sonar.tests=src/backend/tests,src/frontend/src,src/mobile/test

# Inclusiones específicas de suites de prueba
sonar.test.inclusions=src/backend/tests/**,src/frontend/src/**/*.test.ts,src/frontend/src/**/*.test.tsx,src/frontend/src/**/*.spec.ts,src/frontend/src/**/*.spec.tsx,src/mobile/test/**

# Exclusiones globales de análisis (dependencias, compilados, caches)
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/.dart_tool/**,\
  **/.pytest_cache/**,\
  **/__pycache__/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.d.ts,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  src/frontend/src/main.tsx,\
  src/database/**

# Exclusiones de cálculo de cobertura (archivos que no requieren test directo)
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test/**,\
  **/*.test.*,\
  **/*.spec.*,\
  src/frontend/src/main.tsx,\
  src/frontend/src/vite-env.d.ts,\
  src/backend/app/db/init_db.py,\
  src/backend/app/core/config.py

# ------------------------------------------------------------------------------
# 3. Cobertura de Código: Backend (Python / FastAPI / Pytest)
# ------------------------------------------------------------------------------
sonar.python.version=3.13
sonar.python.coverage.reportPaths=src/backend/coverage.xml

# ------------------------------------------------------------------------------
# 4. Cobertura de Código: Frontend (React / TypeScript / Vitest)
# ------------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=src/frontend/tsconfig.json

# ------------------------------------------------------------------------------
# 5. Cobertura de Código: Mobile (Flutter / Dart)
# ------------------------------------------------------------------------------
sonar.dart.coverage.reportPath=src/mobile/coverage/lcov.info
sonar.coverageReportPaths=src/mobile/coverage/lcov.info

